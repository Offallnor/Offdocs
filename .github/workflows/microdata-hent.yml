name: Hent variabelkatalog og veiledning fra microdata.no

on:
  schedule:
    # Hver mandag kl. 06.30 UTC
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: microdata-hent
  cancel-in-progress: false

jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Hent katalog og veiledning
        id: hent
        run: |
          python3 verktoy/microdata_hent.py | tee "$RUNNER_TEMP/rapport.txt"
        continue-on-error: true

      - name: Legg inn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/microdata
          git diff --cached --quiet && exit 0
          { echo "microdata.no: oppdatert katalog og veiledning"; echo; grep -E '^(katalog|veiledning)' "$RUNNER_TEMP/rapport.txt"; } > "$RUNNER_TEMP/melding.txt"
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin "$GITHUB_REF_NAME"
          done
          exit 1

      - name: Varsle om feil
        if: steps.hent.outcome == 'failure' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tittel="microdata.no-henting: feil"
          { echo "@offallnor-bot: den automatiske hentingen fra microdata.no stoppet på noe. Katalogen bruker nettsidens interne datavei, som kan endres uten varsel. Se under, eller be Claude se på det."; echo; cat "$RUNNER_TEMP/rapport.txt"; } > "$RUNNER_TEMP/sak.txt"
          gh label create driftsvarsel --color FBCA04 --description "Varsel fra en fast jobb. Claude går gjennom disse." --force >/dev/null
          nr=$(gh issue list --state open --search "\"$tittel\" in:title" --json number --jq '.[0].number')
          if [ -n "$nr" ]; then
            gh issue comment "$nr" --body-file "$RUNNER_TEMP/sak.txt"
            gh issue edit "$nr" --add-label driftsvarsel >/dev/null
          else
            gh issue create --title "$tittel" --assignee offallnor-bot --label driftsvarsel --body-file "$RUNNER_TEMP/sak.txt"
          fi

      - name: Vis resultatet
        if: always()
        run: cat "$RUNNER_TEMP/rapport.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
