name: Legg inn budsjett fra innboksen

on:
  # Når noen legger en fil i budsjett/innboks/ på main, legges den inn med en gang.
  push:
    branches: [main]
    paths: ["budsjett/innboks/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: budsjett-innboks
  cancel-in-progress: false

jobs:
  budsjett:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Installer avhengigheter
        run: pip install python-docx==1.1.2 openpyxl==3.1.5

      # Eldre proposisjoner finnes bare som RTF (i zip). De gjøres om til Word med LibreOffice.
      - name: Installer LibreOffice ved behov
        if: hashFiles('budsjett/innboks/*.rtf', 'budsjett/innboks/*.zip') != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui

      - name: Legg inn budsjettdokumenter
        run: python3 verktoy/budsjett_innboks.py

      - name: Oppdater nøkkelen over poststrukturen
        run: python3 verktoy/poststruktur.py

      - name: Legg inn på main
        run: |
          [ -f budsjett-rapport.txt ] || exit 0
          mv budsjett-rapport.txt "$RUNNER_TEMP/melding.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -F "$RUNNER_TEMP/melding.txt"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin main
          done
          exit 1

      - name: Vis resultatet
        if: always()
        run: cat "$RUNNER_TEMP/melding.txt" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Innboksen var tom." >> "$GITHUB_STEP_SUMMARY"

      - name: Varsle om feil
        if: failure()
        uses: ./.github/actions/driftsvarsel
        with:
          tittel: "Budsjett fra innboksen: feil"
          tekst: "innleggingen av budsjettdokumenter fra budsjett/innboks/ feilet. Se kjøringen, eller be Claude se på det."
